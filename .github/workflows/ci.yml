name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Gate on CRITICAL only. The remaining "high" advisories are all in
      # build-time dev tooling (vite/esbuild — dev-server only, not shipped) and
      # react-router edge-case redirect advisories with no non-breaking fix at
      # the time of writing. We track them but don't block CI on dev-only noise.
      # Runtime/production dependencies are audited at critical to catch real risk.
      - name: Audit frontend dependencies
        run: npm audit --audit-level=critical

      - name: Audit server dependencies
        run: npm --prefix server audit --audit-level=critical
